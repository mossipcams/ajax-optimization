# Full fine-tune corpus v7: the v6 mix with real-home holdout entities
# unheld, so training and eval draw from the same entity pool.
version: 1
count: 40000
seed: 20261017
split: train
output: training/datasets/sayso_full_sft_v7_20261017.jsonl
manifest: training/datasets/sayso_full_sft_v7_20261017.manifest.json

tokenizer:
  model: LiquidAI/LFM2.5-230M-Base

schema:
  path: schemas/sayso-tool-schema-v2.json

allocations:
  ordinary: 0.22
  follow_up: 0.13
  status: 0.10
  settings: 0.08
  clarify: 0.08
  correction: 0.06
  junk: 0.06
  multi_action: 0.06
  exclusion: 0.05
  aliases: 0.05
  unavailable: 0.04
  unsupported: 0.04
  absence: 0.03

cross_cutting:
  area:
    enabled: true
    distribution: training/configs/area_distribution_v1.json

generation:
  stt_noise_rate: 0.15
  stt_log_rate: 0.10
  paraphrase_enabled: false
  token_budget: 8000
  near_duplicate_limit: 8
  max_attempts_multiplier: 20
  synthetic_only: false
  bare_name_rate: 0.35

real_home:
  path: training/fixtures/real_home.json
  rate: 0.25
  entity_cap: 0
  holdouts: false
  target_weights:
    "Living room lights": 4.0
    Porch_Light: 1.5
    "Outdoor Lights": 1.5
  max_target_share: 0.10

grounding:
  rate: 0.08

discrimination:
  rate: 0.015

coverage:
  min_positive_per_operation: 40
  min_positive_per_tool: 200
  max_absence_rate: 0.10
  get_datetime_positive_min: 400


pairs:
  withheld_tool: 1.0
  clarify: 1.0
  real_home_contrast: 0.2

recipe_exclusions:
  withheld_from_catalog: []
