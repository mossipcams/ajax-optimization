# Full fine-tune corpus v8: the v6 mix with timer, conversation, brightness, restore, and conditional context families taken from ordinary.
version: 1
count: 40000
seed: 20261014
split: train
output: training/datasets/sayso_full_sft_v8_20261020.jsonl
manifest: training/datasets/sayso_full_sft_v8_20261020.manifest.json

tokenizer:
  model: LiquidAI/LFM2.5-230M-Base

schema:
  path: schemas/sayso-tool-schema-v2.json

allocations:
  ordinary: 0.12
  follow_up: 0.13
  status: 0.10
  settings: 0.08
  clarify: 0.08
  correction: 0.06
  junk: 0.06
  multi_action: 0.06
  exclusion: 0.05
  aliases: 0.05
  unavailable: 0.04
  unsupported: 0.04
  absence: 0.03
  timer_context: 0.04
  conversation_context: 0.03
  relative_brightness: 0.01
  restore: 0.01
  conditional: 0.01

cross_cutting:
  area:
    enabled: true
    distribution: training/configs/area_distribution_v1.json

generation:
  stt_noise_rate: 0.15
  stt_log_rate: 0.10
  paraphrase_enabled: false
  token_budget: 8000
  near_duplicate_limit: 8
  max_attempts_multiplier: 30
  synthetic_only: false
  bare_name_rate: 0.35

real_home:
  path: training/fixtures/real_home.json
  rate: 0.10
  entity_cap: 0

grounding:
  rate: 0.08

discrimination:
  rate: 0.015

coverage:
  min_positive_per_operation: 40
  min_positive_per_tool: 200
  max_absence_rate: 0.10
  get_datetime_positive_min: 400

recipe_exclusions:
  withheld_from_catalog: []
