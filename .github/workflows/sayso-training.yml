name: sayso-training

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 1:00 AM US Central standard time
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sayso-training-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: fast tests (not slow)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sayso-training
    steps:
      - name: Check out repository and SaySo submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator test dependencies
        # Only the pins the generator tests import. Torch and llama-cpp-python stay out of CI:
        # no test loads a model, and the tokenizer tests need only the tokenizer package.
        run: |
          grep -E '^(hassil|jsonschema|PyYAML|hypothesis|pytest|transformers|tokenizers|voluptuous|Jinja2)==' training/requirements.txt > "$RUNNER_TEMP/ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/ci-requirements.txt"

      - name: Set PYTHONPATH as training_paths.py does
        run: echo "PYTHONPATH=$(python training_paths.py)" >> "$GITHUB_ENV"

      - name: Run fast tests
        run: python -m pytest training/tests -m 'not slow' -q

  full-tests:
    name: full suite (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sayso-training
    steps:
      - name: Check out repository and SaySo submodule
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator test dependencies
        run: |
          grep -E '^(hassil|jsonschema|PyYAML|hypothesis|pytest|transformers|tokenizers|voluptuous|Jinja2)==' training/requirements.txt > "$RUNNER_TEMP/ci-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/ci-requirements.txt"

      - name: Set PYTHONPATH as training_paths.py does
        run: echo "PYTHONPATH=$(python training_paths.py)" >> "$GITHUB_ENV"

      - name: Run full suite
        run: python -m pytest training/tests -q
